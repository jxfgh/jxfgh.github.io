short_bio: >-
  <p>I am a computer scientist and financial technology researcher working at the intersection of computer science, finance, and financial systems. My PhD research applies graph neural networks to smart-contract fraud detection.</p>
  <p>I bring more than a decade of experience in financial technology research and standard setting in China’s central-bank system and its principal technology subsidiary. I am a CFA charterholder and am completing an MBA at Massey University in Auckland.</p>
  <p>My academic interests span graph machine learning, financial fraud and risk analytics, RegTech, blockchain, and digital finance. I am interested in teaching students to connect technical methods with the financial and institutional settings in which they are used.</p>

